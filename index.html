<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tower">
<title>Tower</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5BEA'/%3E%3Ccircle cx='22' cy='24' r='6' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M34 24h16M34 40h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='40' r='6' fill='white'/%3E%3C/svg%3E">
<style>
/* Tower: a quiet, list-first task app. Grouped inset surfaces, one tint, list colours as identity only. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F7F7FA; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --sep:rgba(60,60,67,.16); --label:#0B0B0F; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.34);
  --tint:#2F5BEA; --tint-ink:#FFFFFF; --flag:#E8890C; --red:#D93B3B; --green:#1F9D55;
  --c-blue:#3B6FF5; --c-orange:#EF8B2C; --c-green:#2AA866; --c-pink:#E5508A; --c-yellow:#D9A300; --c-teal:#139DB3; --c-purple:#8B5CF6; --c-olive:#7A8F2A; --c-gray:#8E8E93;
  --shadow:0 10px 40px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06);
  --scrim:rgba(0,0,0,.24);
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px; --row:48px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B0B0D; --surface:#1C1C1F; --surface2:#242428; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --sep:rgba(255,255,255,.1); --label:#F5F5F7; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --tint:#6B8CFF; --tint-ink:#0B0B0D; --flag:#FFA733; --red:#FF6B6B; --green:#4ADE80;
  --c-blue:#6B8CFF; --c-orange:#FFA05A; --c-green:#4CCB86; --c-pink:#FF77A8; --c-yellow:#F2C230; --c-teal:#3CC6DC; --c-purple:#A98BFF; --c-olive:#A9C34E; --c-gray:#98989F;
  --shadow:0 10px 40px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--label);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.side{background:var(--bg);border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0;height:100%}
.side-scroll{overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
.side-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;border-top:1px solid var(--sep)}
.pane{min-width:0;display:flex;flex-direction:column;background:var(--surface);min-height:0;height:100%;overflow:hidden}
.pane-scroll{overflow-y:auto;flex:1;padding:0 0 calc(80px + env(safe-area-inset-bottom,0px))}

.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px}
.search svg{width:16px;height:16px;color:var(--label2);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;font-size:16px}
.search input::placeholder{color:var(--label2)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:10px 12px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 8px;text-align:left;min-height:84px;align-content:space-between}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tc)}
.tile .ic svg{width:17px;height:17px}
.tile .n{justify-self:end;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tile .l{grid-column:1/-1;font-weight:600;color:var(--label2);font-size:15px}
.tile[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--tc)}
.tile[aria-current="true"] .l{color:var(--tc)}
.daynum{font-size:11.5px;font-weight:700;line-height:1}

.sect-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 6px}
.sect-h h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:0 12px;min-height:46px;text-align:left;position:relative}
.lrow+.lrow::before{content:"";position:absolute;left:52px;right:0;top:0;border-top:1px solid var(--sep)}
.lrow:hover{background:var(--surface2)}
.lrow[aria-current="true"]{background:var(--fill)}
.lrow .lic{width:28px;height:28px;border-radius:50%;background:var(--lc);display:grid;place-items:center;color:#fff;flex:none}
.lrow .lic svg{width:15px;height:15px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ct{color:var(--label2);font-variant-numeric:tabular-nums}
.lrow.dim .nm{color:var(--label2)}
.lrow .chev{width:8px;height:13px;color:var(--label3)}
.check-banner{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.check-banner .dotw{width:28px;height:28px;border-radius:50%;background:var(--flag);display:grid;place-items:center;color:#fff;flex:none}
.check-banner .dotw svg{width:15px;height:15px}
.check-banner b{font-weight:600}
.check-banner span{color:var(--label2);font-size:14px}
.check-banner[aria-current="true"]{outline:2px solid var(--flag)}
.addlist{color:var(--tint);font-weight:500;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 4px}
.addlist svg{width:20px;height:20px}
.sync{font-size:12.5px;color:var(--label2);flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.sync.saving i{background:var(--flag)} .sync.err i{background:var(--red)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.iconbtn:hover{background:var(--fill)}
.iconbtn svg{width:20px;height:20px}

/* ---------- pane ---------- */
.phead{position:sticky;top:0;z-index:5;background:var(--surface);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 8px;display:flex;flex-direction:column;gap:2px}
.phead .bar{display:flex;align-items:center;gap:6px;min-height:40px}
.back{display:none;align-items:center;gap:2px;color:var(--tint);font-size:17px;min-height:40px;padding-right:8px}
.back svg{width:12px;height:20px}
.phead .sp{flex:1}
.phead h1{font-size:32px;line-height:1.1;font-weight:700;margin:0;color:var(--hc,var(--label));letter-spacing:-.015em;text-wrap:balance}
.phead .sub{color:var(--label2);font-size:14px;min-height:18px}
.phead .sub a{color:var(--tint);text-decoration:none}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:42px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);min-width:220px;padding:6px;z-index:30;display:flex;flex-direction:column}
.menu-pop button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;text-align:left}
.menu-pop button:hover{background:var(--fill)}
.menu-pop hr{border:0;border-top:1px solid var(--sep);margin:4px 6px}

.section-label{font-size:14px;font-weight:600;color:var(--label2);padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-label.red{color:var(--red)}
.section-label .c{font-weight:400}
.section-label .lc-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--lc);margin-right:6px}

/* task rows */
.rows{display:flex;flex-direction:column}
.task{position:relative;overflow:hidden;touch-action:pan-y}
.task-inner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:12px;padding:11px 16px 11px 20px;background:var(--surface);position:relative;transition:transform .2s ease}
.task-inner::after{content:"";position:absolute;left:56px;right:0;bottom:0;border-bottom:1px solid var(--sep)}
.task.sel .task-inner{background:color-mix(in srgb,var(--tint) 9%,var(--surface))}
@media (hover:hover) and (pointer:fine){.swipe-acts{display:none}}
.circle{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);display:grid;place-items:center;margin-top:1px;flex:none;position:relative;transition:border-color .15s,background .15s}
.circle::before{content:"";position:absolute;inset:-10px}
.circle:hover{border-color:var(--lc,var(--tint))}
.circle i{width:12px;height:12px;border-radius:50%;background:var(--lc,var(--tint));transform:scale(0);transition:transform .2s cubic-bezier(.3,1.5,.6,1)}
.task.done .circle{border-color:var(--lc,var(--tint))}
.task.done .circle i{transform:scale(1)}
.tbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.ttitle{overflow-wrap:anywhere;cursor:text;line-height:1.3}
.ttitle .pri{color:var(--lc,var(--tint));font-weight:700;margin-right:4px}
.task.done .ttitle{color:var(--label2)}
.tmeta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:14px;color:var(--label2);align-items:center}
.tmeta .late{color:var(--red)}
.tmeta .lname{color:var(--lc)}
.tmeta svg{width:13px;height:13px;display:inline-block;vertical-align:-2px}
.tmeta .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tmeta .seed{color:var(--flag)}
.tright{display:flex;align-items:center;gap:4px;margin-top:-4px}
.flagmark{color:var(--flag);width:28px;height:28px;display:grid;place-items:center}
.flagmark svg{width:15px;height:15px}
.info{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tint);opacity:0}
.info svg{width:21px;height:21px}
.task:hover .info,.task.sel .info,.info:focus-visible{opacity:1}
@media (hover:none){.info{opacity:1;color:var(--label3)}}
.ttitle-edit{width:100%;border:0;outline:none;background:none;padding:0;line-height:1.3}
.task.completing .task-inner{animation:fadeout 1.6s ease forwards}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:.35}}
.swipe-acts{position:absolute;right:0;top:0;bottom:0;display:flex}
.swipe-acts button{width:76px;color:#fff;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.swipe-acts svg{width:18px;height:18px}
.sa-flag{background:var(--flag)} .sa-del{background:var(--red)}
.quick{display:flex;gap:6px;padding:0 20px 0 56px;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:4px}

/* new task row */
.newrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;padding:11px 16px 6px 20px}
.newrow .circle{border-style:dashed}
.newrow input{border:0;outline:none;background:none;width:100%;padding:0;line-height:1.3;min-height:22px}
.newrow input::placeholder{color:var(--label3)}
.newadd{display:flex;align-items:center;gap:10px;color:var(--label2);padding:12px 20px;font-size:16px;width:100%;text-align:left}
.newadd svg{width:22px;height:22px;color:var(--lc,var(--tint))}
.newadd:hover{color:var(--label)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 20px 12px 56px}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:500;color:var(--label)}
.chip:hover{background:var(--fill2)}
.chip.on{background:var(--tint);color:var(--tint-ink)}
.chip.det{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.chip.flagon{background:var(--flag);color:#fff}
.chip svg{width:13px;height:13px}
.chip .x{opacity:.7;margin-left:2px}
.hint{font-size:13px;color:var(--label3);padding:0 20px 10px 56px}

.empty{padding:56px 24px;text-align:center;color:var(--label2);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--label);font-size:18px}
.empty svg{width:44px;height:44px;color:var(--label3);margin-bottom:6px}
.showdone{color:var(--tint);font-size:15px;padding:16px 20px}

/* files & decisions in list view */
.extras{padding:8px 20px 0;display:flex;flex-direction:column;gap:8px}
.disc{background:var(--surface2);border-radius:var(--r);overflow:hidden}
.disc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600}
.disc summary::-webkit-details-marker{display:none}
.disc summary .c{color:var(--label2);font-weight:400;margin-left:auto}
.disc summary svg{width:16px;height:16px;color:var(--label2);transition:transform .2s}
.disc[open] summary svg.chev2{transform:rotate(90deg)}
.xrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--sep);min-height:44px}
.xrow a{color:var(--label);text-decoration:none;flex:1;min-width:0;overflow-wrap:anywhere}
.xrow a:hover{color:var(--tint)}
.xrow .k{font-size:12.5px;color:var(--label2);background:var(--fill);border-radius:6px;padding:2px 7px;flex:none}
.xrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.xrow .st{font-size:13px;font-weight:600;border-radius:6px;padding:3px 8px;flex:none}
.st.Locked{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.st.Assumed{background:color-mix(in srgb,var(--flag) 18%,transparent);color:var(--flag)}
.st.Revised{background:var(--fill);color:var(--label2);text-decoration:line-through}
.xadd{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--sep);flex-wrap:wrap}
.xadd input{flex:1 1 160px;min-width:0;border:0;background:var(--surface);border-radius:8px;padding:8px 10px;outline:none}
.xadd input:focus{box-shadow:0 0 0 2px var(--tint)}
.btn{height:36px;padding:0 14px;border-radius:9px;background:var(--fill);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.btn.tint{background:var(--tint);color:var(--tint-ink)}
.btn.red{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--bg);border-radius:14px;width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 14px;border-bottom:1px solid var(--sep);background:var(--bg)}
.sheet-h h2{font-size:17px;font-weight:600;margin:0;text-align:center}
.sheet-h .l{justify-self:start;color:var(--tint);font-size:17px;min-height:36px}
.sheet-h .r{justify-self:end;color:var(--tint);font-weight:600;font-size:17px;min-height:36px}
.sheet-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px}
.sheet-b>*{flex-shrink:0}
.ig{background:var(--surface);border-radius:var(--r);overflow:hidden}
.ig-cap{font-size:13px;color:var(--label2);padding:0 14px 6px;text-transform:uppercase;letter-spacing:.02em}
.ig-row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;position:relative}
.ig-row+.ig-row::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:1px solid var(--sep)}
.ig-row.ic+.ig-row::before,.ig-row.ic::before{left:56px}
.ig-row .rl{flex:1;min-width:0}
.ig-row .ricon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ig-row .ricon svg{width:17px;height:17px}
.ig-row .sub2{display:block;font-size:13.5px;color:var(--tint)}
.ig-row input[type=text],.ig-row input[type=url],.ig-row input[type=number],.ig-row textarea{border:0;background:none;outline:none;width:100%;padding:12px 0}
.ig-row textarea{resize:none;min-height:64px;line-height:1.4}
.ig-row input.big{font-size:18px;font-weight:600}
.ig-row select{border:0;background:none;color:var(--label2);text-align:right;outline:none;padding:10px 0;max-width:60%}
.ig-row input[type=date]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;color:var(--tint);outline:none}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.log{padding:6px 14px 12px;display:flex;flex-direction:column;gap:8px}
.log .le{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14.5px}
.log .le time{color:var(--label2);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;padding-top:1px}
.log .le span{white-space:pre-wrap;overflow-wrap:anywhere}
.log .none{color:var(--label3);font-size:14px}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--flag) 14%,var(--surface));border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.banner span{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
.sw{width:32px;height:32px;border-radius:50%;background:var(--sc);position:relative}
.sw[aria-checked="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--sc)}
.delete-row{color:var(--red);justify-content:center;font-weight:500;width:100%}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,34,.94);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:15px}
.toast button{color:#8FB0FF;font-weight:600;padding:4px 6px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}}

/* ---------- gate screens ---------- */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{width:min(520px,100%);display:flex;flex-direction:column;gap:18px}
.gate-logo{width:64px;height:64px;border-radius:16px;background:var(--tint);display:grid;place-items:center;color:#fff}
.gate-logo svg{width:34px;height:34px}
.gate h1{font-size:30px;margin:0;letter-spacing:-.015em}
.gate p{margin:0;color:var(--label2);line-height:1.5}
.gate ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--label);line-height:1.45}
.gate code{background:var(--fill);border-radius:6px;padding:1px 6px;font-size:14px;word-break:break-all}
.gate label{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.gate input{width:100%;border:0;background:var(--surface);border-radius:10px;padding:12px;outline:none}
.gate input:focus{box-shadow:0 0 0 2px var(--tint)}
.gbtn{height:50px;border-radius:12px;background:var(--tint);color:var(--tint-ink);font-weight:600;font-size:17px;width:100%}
.gbtn.alt{background:var(--fill);color:var(--label)}
.err{color:var(--red);font-size:14.5px}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0}
  .app[data-screen="list"] .side{display:none}
